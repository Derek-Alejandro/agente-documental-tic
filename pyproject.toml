
# ==========================================
# ARCHIVO TIC IA - PRACTICA 2.3
# Instituto Tecnologico de Pachuca
#
# Configuracion de Python y Vercel
# ==========================================

[project]

name = "agente-documental-tic"

version = "1.0.0"

description = "Agente documental con Google Drive, OpenAI y File Search"

requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "openai>=1.80,<3",
    "python-dotenv>=1,<2",
    "google-api-python-client>=2.140,<3",
    "google-auth-httplib2>=0.2,<1",
    "google-auth-oauthlib>=1.2,<2",
    "pydantic>=2,<3",
    "pytest>=8,<10",
    "httpx>=0.27,<1"
]


# ==========================================
# PUNTO DE ENTRADA PARA VERCEL
# ==========================================

[tool.vercel]

entrypoint = "app.main:app"
